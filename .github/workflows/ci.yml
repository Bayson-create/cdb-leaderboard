name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate every submission package
        run: |
          set -e
          for d in submissions/*/; do
            [ -f "$d/package.json" ] || continue
            rc=0; python -m cdb_score validate "$d" > /tmp/v.json || rc=$?
            python -c "import json;v=json.load(open('/tmp/v.json'));print('$d', v['status'], v['n_cells_complete'], '/', v['n_cells_total'], 'cells')"
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit 1; fi
          done
      - name: Build twice and compare bytes
        run: |
          python -m cdb_score build --out /tmp/cdb-lb-a.json
          python -m cdb_score build --out /tmp/cdb-lb-b.json
          cmp /tmp/cdb-lb-a.json /tmp/cdb-lb-b.json
          echo "leaderboard build is byte-for-byte deterministic"
